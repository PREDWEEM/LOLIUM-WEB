name: Mantener activas las apps del mapa

on:
  schedule:
    # Cada 4 horas (UTC), fuera del inicio de la hora. Streamlit Community Cloud
    # hiberna las apps tras varias horas sin visitas.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantener-apps-activas
  cancel-in-progress: false

jobs:
  listar:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.lista.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: lista
        run: echo "apps=$(python3 scripts/despertar_apps.py --listar)" >> "$GITHUB_OUTPUT"

  despertar:
    needs: listar
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.listar.outputs.apps) }}
    name: ${{ matrix.app.nombre }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          python -m pip install "playwright==1.58.0"
          python -m playwright install --with-deps chromium
      - name: Abrir y despertar ${{ matrix.app.nombre }}
        env:
          APP_URL: ${{ matrix.app.url }}
          APP_NOMBRE: ${{ matrix.app.nombre }}
          RESULTADO_JSON: resultado-${{ matrix.app.slug }}.json
        run: python scripts/despertar_apps.py "$APP_URL" "$APP_NOMBRE"
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ matrix.app.slug }}
          path: resultado-${{ matrix.app.slug }}.json
          if-no-files-found: ignore
          retention-days: 1

  estado:
    # Actualiza estado_apps.json (colores del mapa) con la respuesta de cada app y sus datos.
    needs: despertar
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: resultado-*
          path: resultados
          merge-multiple: true
      - name: Calcular estado de las apps
        run: python3 scripts/estado_apps.py resultados
      - name: Publicar estado
        run: |
          if git diff --quiet -- estado_apps.json; then
            echo "Sin cambios en el estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add estado_apps.json
          git commit -m "Actualiza estado de las apps del mapa"
          git push
